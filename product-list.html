<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
    <title th:text="#{product.title}">Products</title>
    <link rel="stylesheet" th:href="@{/styles.css}" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<h1 th:text="#{product.title}">Products</h1>

<div>
    <a th:href="@{/products?lang=tr}" th:text="#{language.turkish}">Türkçe</a>
    |
    <a th:href="@{/products?lang=en}" th:text="#{language.english}">English</a>
    |
    <a th:href="@{/products?lang=de}" th:text="#{language.german}">Deutsch</a>
</div>
<table class="table table-striped table-bordered">
    <thead class="thead-dark">
    <tr>
        <th th:text="#{product.id}">ID</th>
        <th th:text="#{product.name}">Name</th>
        <th th:text="#{product.price}">Price</th>
        <th th:text="#{product.dateAdded}">Date Added</th>
        <th th:text="#{product.description}">Description</th>
        <th th:text="#{product.actions}">Actions</th>
        <th th:text="#{product.categories}">Categories</th>

    </tr>
    </thead>
    <tbody>
    <tr th:each="product : ${products}">
        <td th:text="${product.id}">1</td>
        <td th:text="${product.name}">Product Name</td>
        <td th:text="${product.price}">100.0</td>    
        <td th:text="${#temporals.format(product.dateAdded, 'dd.MM.yyyy')}">2024-01-01</td> 
        <td th:text="${product.description}"></td>
   	    
        <td>
            <a th:href="@{/products/edit/{id}(id=${product.id})}" th:text="#{product.edit}">Edit</a>
            |
            <form th:action="@{/products/delete/{id}(id=${product.id})}" method="post" style="display:inline">
                <button type="submit" class="btn btn-link p-0" th:text="#{product.delete}" onclick="return confirm('Delete this product?')">Delete</button>
            </form>
           
        </td>
         
         <td th:each="category : ${product.categories}" th:text="${category}"></td>
    </tr>
    </tbody>
</table>

<a th:href="@{/products/new(lang=${#locale.language})}" class="btn btn-primary" th:text="#{product.createNew}">Create New Product</a>

</body>
</html>
