spring.application.name=Small Business Management System
# Local demonstration: ephemeral in-memory H2 database
spring.datasource.url=jdbc:h2:mem:smallbusinessdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# Disabled by default; do not expose a database console publicly.
spring.h2.console.enabled=false
spring.thymeleaf.cache=false
spring.messages.basename=messages
spring.messages.encoding=UTF-8
